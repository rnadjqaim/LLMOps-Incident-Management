[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmops-incident-api"
version = "0.1.0"
description = "Incident timeline builder for LLMOps systems"
readme = "../../README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0"
]

[tool.hatch.build.targets.wheel]
packages = ["llmops_incident"]

[tool.ruff]
line-length = 100
target-version = "py310"
